<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Thank you: Scriptural Project</title>
        <meta name="description" content="Put songs and scripture on screen in church meetings. Scriptural listens to the preacher and brings up each verse as it is read." />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <link rel="canonical" href="https://project.scriptural.online/thanks" />
        <meta name="theme-color" content="#080808" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Scriptural Project" />
        <meta property="og:title" content="Thank you: Scriptural Project" />
        <meta property="og:description" content="Put songs and scripture on screen in church meetings. Scriptural listens to the preacher and brings up each verse as it is read." />
        <meta property="og:url" content="https://project.scriptural.online/thanks" />
        <meta property="og:image" content="https://project.scriptural.online/og.jpg" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Scriptural Project: Psalm 23:1 on a church screen" />
        <meta name="twitter:card" content="summary_large_image" />
        <script>
            try {
                const theme = localStorage.getItem("theme")
                if (theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark")
            } catch {}
        </script>
        <style>
            :root {
                --background: hsl(36 30% 97%);
                --card: hsl(36 30% 97%);
                --border: hsl(36 15% 87%);
                --foreground: hsl(30 8% 12%);
                --muted: hsl(30 5% 40%);
                color-scheme: light;
            }
            .dark {
                --background: hsl(0 0% 3%);
                --card: hsl(0 0% 7%);
                --border: hsl(0 0% 18%);
                --foreground: hsl(0 0% 97%);
                --muted: hsl(0 0% 74%);
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--background);
                color: var(--foreground);
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
                line-height: 1.55;
                -webkit-font-smoothing: antialiased;
            }
            main {
                max-width: 640px;
                margin: 0 auto;
                padding: 72px 24px 48px;
            }
            img {
                width: 56px;
                height: 56px;
                border-radius: 14px;
            }
            h1 {
                font-size: 2.25rem;
                font-weight: 700;
                letter-spacing: -0.025em;
                line-height: 1.15;
                margin: 28px 0 12px;
            }
            p {
                color: var(--muted);
                margin: 0 0 16px;
            }
            .downloads {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin: 32px 0 12px;
            }
            .downloads a {
                display: inline-block;
                padding: 10px 18px;
                border-radius: 999px;
                background: var(--foreground);
                color: var(--background);
                font-weight: 600;
                text-decoration: none;
            }
            .downloads a.secondary {
                background: transparent;
                color: var(--foreground);
                border: 1px solid var(--border);
            }
            .note {
                font-size: 0.875rem;
            }
            hr {
                border: 0;
                border-top: 1px solid var(--border);
                margin: 40px 0;
            }
            h2 {
                font-size: 1.125rem;
                font-weight: 600;
                margin: 0 0 8px;
            }
            section + section {
                margin-top: 24px;
            }
            a {
                color: var(--foreground);
            }
            footer {
                font-size: 0.8125rem;
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <main>
            <a href="/"><img src="/icon.png" alt="Scriptural Project" /></a>
            <h1>Thank you</h1>
            <p>Your church's plan is active. Back in the app, open Import, then Church library, to see it. Licensed Bible versions can be asked for under Import scripture.</p>
            <p><a href="/">Back to Scriptural Project</a></p>
        </main>
    </body>
</html>
