<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Thank you: Scriptural Project</title>
        <meta name="description" content="Put songs and scripture on screen in church meetings. Scriptural listens to the preacher and brings up each verse as it is read." />
        <link rel="icon" href="/favicon.ico" />
        <style>
            @font-face {
                font-family: "Inter";
                src: url("/inter.woff2") format("woff2");
                font-weight: 100 900;
                font-display: swap;
            }
            :root {
                --background: #080808;
                --card: #121212;
                --border: #262626;
                --foreground: #f7f7f7;
                --muted: #bdbdbd;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--background);
                color: var(--foreground);
                font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.55;
                -webkit-font-smoothing: antialiased;
            }
            main {
                max-width: 640px;
                margin: 0 auto;
                padding: 72px 24px 48px;
            }
            img {
                width: 56px;
                height: 56px;
                border-radius: 14px;
            }
            h1 {
                font-size: 2.25rem;
                font-weight: 600;
                letter-spacing: -0.02em;
                line-height: 1.15;
                margin: 28px 0 12px;
            }
            p {
                color: var(--muted);
                margin: 0 0 16px;
            }
            .downloads {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin: 32px 0 12px;
            }
            .downloads a {
                display: inline-block;
                padding: 10px 18px;
                border-radius: 10px;
                background: var(--foreground);
                color: var(--background);
                font-weight: 600;
                text-decoration: none;
            }
            .downloads a.secondary {
                background: transparent;
                color: var(--foreground);
                border: 1px solid var(--border);
            }
            .note {
                font-size: 0.875rem;
            }
            hr {
                border: 0;
                border-top: 1px solid var(--border);
                margin: 40px 0;
            }
            h2 {
                font-size: 1.125rem;
                font-weight: 600;
                margin: 0 0 8px;
            }
            section + section {
                margin-top: 24px;
            }
            a {
                color: var(--foreground);
            }
            footer {
                font-size: 0.8125rem;
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <main>
            <a href="/"><img src="/icon.png" alt="Scriptural Project" /></a>
            <h1>Thank you</h1>
            <p>Your church's plan is active. Back in the app, open Import, then Church library, to see it. Licensed Bible versions can be asked for under Import scripture.</p>
            <p><a href="/">Back to Scriptural Project</a></p>
        </main>
    </body>
</html>
