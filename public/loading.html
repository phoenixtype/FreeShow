<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scriptural</title>

        <link rel="stylesheet" href="global.css" />

        <style>
            :root {
                --radius: 5px;
                --loader-height: 3px;
            }

            main {
                /* background-color: var(--primary); */
                background-color: var(--primary-darkest);
                width: 100%;
                height: 100%;
                border-radius: var(--radius);

                display: flex;
                flex-direction: column;
                gap: 10px;
                justify-content: center;
                align-items: center;
                -webkit-app-region: drag;

                overflow: hidden;
            }

            img {
                position: absolute;
                left: 21%;
                top: 50%;
                width: 96px;
                height: 96px;
                transform: translate(-50%, -50%);
                border-radius: 22.27%;
                box-shadow: 0 0 0 1px rgb(255 255 255 / 0.12);
            }

            .text {
                position: absolute;
                right: 0;
                width: 58%;

                text-align: center;
            }

            .v {
                opacity: 0.3;
                font-size: 0.9em;
            }

            h1 {
                font-size: 3em;
                color: var(--text);
                font-weight: 600;
            }

            .loader {
                --margin: 1.5px; /* calc(var(--radius) / 2); */
                background-color: var(--primary-lighter);
                margin: 0 var(--margin);
                border-top-left-radius: 40px;
                border-top-right-radius: 40px;

                position: absolute;
                top: 0;
                width: calc(100% - (var(--margin) * 2));
                height: var(--loader-height);

                overflow: hidden;
            }

            .loader span:before {
                content: "";
                position: absolute;
                height: 100%;
                background-color: var(--secondary);
                animation: first 1.8s infinite ease-out;
            }

            .loader span:after {
                content: "";
                position: absolute;
                height: 100%;
                background-color: var(--secondary);
                animation: second 1.8s infinite ease-in;
            }

            @keyframes first {
                0% {
                    inset-inline-start: -100%;
                    width: 80%;
                }
                100% {
                    inset-inline-start: 100%;
                    width: 20%;
                }
            }

            @keyframes second {
                0% {
                    inset-inline-start: -150%;
                    width: 80%;
                }
                100% {
                    inset-inline-start: 100%;
                    width: 20%;
                }
            }
        </style>
    </head>
    <body>
        <div class="loader">
            <span></span>
        </div>

        <main>
            <img src="./scriptural-logo.svg" alt="" draggable="false" />

            <div class="text">
                <h1>Scriptural</h1>
                <p class="v">v<span class="version">0.0.0</span></p>
            </div>
        </main>

        <script>
            const { ipcRenderer } = require("electron")

            ipcRenderer.send("MAIN", { channel: "VERSION" })
            ipcRenderer.once("MAIN", (e, msg) => {
                if (msg.channel !== "VERSION" || !msg.data) return
                document.querySelector(".version").innerHTML = msg.data
            })
        </script>
    </body>
</html>
