name: Release
# A release is a version tag (npm version patch && git push --follow-tags), never a push to main.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: "Verify version and tests"
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version. Run npm version, then push the tag it makes."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  publish_windows:
    needs: verify
    name: "Publish Windows"
    runs-on: windows-2022

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build and release app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # our own API keys, written into the app by scripts/ownKeys.js; a missing one hides that provider
          SCRIPTURAL_PIXABAY_KEY: ${{ secrets.SCRIPTURAL_PIXABAY_KEY }}
          SCRIPTURAL_UNSPLASH_KEY: ${{ secrets.SCRIPTURAL_UNSPLASH_KEY }}
          SCRIPTURAL_BIBLEAPI_KEY: ${{ secrets.SCRIPTURAL_BIBLEAPI_KEY }}
          SCRIPTURAL_PCO_CLIENT_ID: ${{ secrets.SCRIPTURAL_PCO_CLIENT_ID }}
          SCRIPTURAL_PCO_CLIENT_SECRET: ${{ secrets.SCRIPTURAL_PCO_CLIENT_SECRET }}
          SCRIPTURAL_CHURCHAPPS_CLIENT_ID: ${{ secrets.SCRIPTURAL_CHURCHAPPS_CLIENT_ID }}
          SCRIPTURAL_CHURCHAPPS_CLIENT_SECRET: ${{ secrets.SCRIPTURAL_CHURCHAPPS_CLIENT_SECRET }}
          SCRIPTURAL_AMAZINGLIFE_CLIENT_ID: ${{ secrets.SCRIPTURAL_AMAZINGLIFE_CLIENT_ID }}
        run: npm run release

  publish_linux:
    needs: verify
    name: "Publish Linux x64"
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install libraries
        run:
          |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev uuid-dev libltc-dev libusb-1.0-0-dev libudev-dev libegl1-mesa-dev libgles2-mesa-dev --fix-missing

      - name: Install dependencies
        run: npm ci

      - name: Build and release app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # our own API keys, written into the app by scripts/ownKeys.js; a missing one hides that provider
          SCRIPTURAL_PIXABAY_KEY: ${{ secrets.SCRIPTURAL_PIXABAY_KEY }}
          SCRIPTURAL_UNSPLASH_KEY: ${{ secrets.SCRIPTURAL_UNSPLASH_KEY }}
          SCRIPTURAL_BIBLEAPI_KEY: ${{ secrets.SCRIPTURAL_BIBLEAPI_KEY }}
          SCRIPTURAL_PCO_CLIENT_ID: ${{ secrets.SCRIPTURAL_PCO_CLIENT_ID }}
          SCRIPTURAL_PCO_CLIENT_SECRET: ${{ secrets.SCRIPTURAL_PCO_CLIENT_SECRET }}
          SCRIPTURAL_CHURCHAPPS_CLIENT_ID: ${{ secrets.SCRIPTURAL_CHURCHAPPS_CLIENT_ID }}
          SCRIPTURAL_CHURCHAPPS_CLIENT_SECRET: ${{ secrets.SCRIPTURAL_CHURCHAPPS_CLIENT_SECRET }}
          SCRIPTURAL_AMAZINGLIFE_CLIENT_ID: ${{ secrets.SCRIPTURAL_AMAZINGLIFE_CLIENT_ID }}
        run: npm run release

  # This needs it's own build
  # https://github.com/ChurchApps/FreeShow/issues/562
  publish_linux_arm:
    needs: verify
    name: "Publish Linux arm64"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install libraries
        run:
          |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev uuid-dev libltc-dev libusb-1.0-0-dev libudev-dev libegl1-mesa-dev libgles2-mesa-dev --fix-missing

      - name: Install dependencies
        run: npm ci

      - name: Install FPM
        run:
          |
          sudo apt-get install ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      # wait because this will only publish if the draft exists
      - name: Sleep for 1.5 minute
        run: sleep 90s
        shell: bash

      - name: Build and release app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # our own API keys, written into the app by scripts/ownKeys.js; a missing one hides that provider
          SCRIPTURAL_PIXABAY_KEY: ${{ secrets.SCRIPTURAL_PIXABAY_KEY }}
          SCRIPTURAL_UNSPLASH_KEY: ${{ secrets.SCRIPTURAL_UNSPLASH_KEY }}
          SCRIPTURAL_BIBLEAPI_KEY: ${{ secrets.SCRIPTURAL_BIBLEAPI_KEY }}
          SCRIPTURAL_PCO_CLIENT_ID: ${{ secrets.SCRIPTURAL_PCO_CLIENT_ID }}
          SCRIPTURAL_PCO_CLIENT_SECRET: ${{ secrets.SCRIPTURAL_PCO_CLIENT_SECRET }}
          SCRIPTURAL_CHURCHAPPS_CLIENT_ID: ${{ secrets.SCRIPTURAL_CHURCHAPPS_CLIENT_ID }}
          SCRIPTURAL_CHURCHAPPS_CLIENT_SECRET: ${{ secrets.SCRIPTURAL_CHURCHAPPS_CLIENT_SECRET }}
          SCRIPTURAL_AMAZINGLIFE_CLIENT_ID: ${{ secrets.SCRIPTURAL_AMAZINGLIFE_CLIENT_ID }}
          USE_SYSTEM_FPM: true
        run: npm run release

  publish_mac:
    needs: verify
    name: "Publish MacOS"
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and NPM
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Change Python version: https://github.com/nodejs/node-gyp/issues/2869
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # This probably does not make any difference.
      - name: Install node-gyp
        run: npm install -g node-gyp

      - name: Install dependencies
        run: npm ci

      - name: Install dmg-license
        run: npm i dmg-license

      # for some reason the build command don't continue after the rollup build
      - name: Sleep for 3 minutes
        run: sleep 180
        shell: bash

      - name: Build and release app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # our own API keys, written into the app by scripts/ownKeys.js; a missing one hides that provider
          SCRIPTURAL_PIXABAY_KEY: ${{ secrets.SCRIPTURAL_PIXABAY_KEY }}
          SCRIPTURAL_UNSPLASH_KEY: ${{ secrets.SCRIPTURAL_UNSPLASH_KEY }}
          SCRIPTURAL_BIBLEAPI_KEY: ${{ secrets.SCRIPTURAL_BIBLEAPI_KEY }}
          SCRIPTURAL_PCO_CLIENT_ID: ${{ secrets.SCRIPTURAL_PCO_CLIENT_ID }}
          SCRIPTURAL_PCO_CLIENT_SECRET: ${{ secrets.SCRIPTURAL_PCO_CLIENT_SECRET }}
          SCRIPTURAL_CHURCHAPPS_CLIENT_ID: ${{ secrets.SCRIPTURAL_CHURCHAPPS_CLIENT_ID }}
          SCRIPTURAL_CHURCHAPPS_CLIENT_SECRET: ${{ secrets.SCRIPTURAL_CHURCHAPPS_CLIENT_SECRET }}
          SCRIPTURAL_AMAZINGLIFE_CLIENT_ID: ${{ secrets.SCRIPTURAL_AMAZINGLIFE_CLIENT_ID }}
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          SECRET_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SECRET_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # electron-builder treats an empty CSC_LINK as a file path and aborts
        # ("not a file"), so each signing variable is exported only when its
        # secret exists. Unsigned builds still produce the dmg. Notarization
        # uses the App Store Connect API key (scripts/macos/notarize.js).
        run: |
          [ -n "$SECRET_CSC_LINK" ] && export CSC_LINK="$SECRET_CSC_LINK"
          [ -n "$SECRET_CSC_KEY_PASSWORD" ] && export CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
          if [ -n "$SECRET_APPLE_API_KEY_CONTENT" ]; then
            printf '%s' "$SECRET_APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_ID="$SECRET_APPLE_API_KEY_ID"
            export APPLE_API_ISSUER="$SECRET_APPLE_API_ISSUER"
          fi
          npm run release

      # a failed check keeps the release a draft (publish_release needs this job)
      - name: Check the apps are notarized
        run: |
          shopt -s nullglob
          apps=(dist/mac*/*.app)
          [ ${#apps[@]} -gt 0 ] || { echo "No built app found to check"; exit 1; }
          for app in "${apps[@]}"; do
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done

  publish_release:
    name: "Publish the draft"
    needs: [publish_windows, publish_linux, publish_linux_arm, publish_mac]
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      # GPL-3.0: the source of what we ship sits beside the installers. The site's /licences/ links it.
      - name: Attach the source code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          git fetch --depth 1 origin "+refs/tags/v$version:refs/tags/v$version"
          git archive --format=tar.gz --prefix="scriptural-project-$version/" -o "scriptural-project-$version-source.tar.gz" "v$version"
          gh release upload "v$version" "scriptural-project-$version-source.tar.gz" --clobber

      # electron-builder uploads every installer to a draft; it goes public only when all four uploaded
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false --latest
